name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src sdk-python tests api
      - run: python -m ruff format --check src sdk-python tests api
      - run: python -m pytest --cov=agentblackbox --cov-report=term-missing
      - run: python -m mypy src sdk-python api
        continue-on-error: true
      - run: python -m bandit -q -r src api sdk-python
        continue-on-error: true
      - run: python -m pip_audit --progress-spinner off
        continue-on-error: true

  source-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        continue-on-error: true
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git -c /repo detect --source=/repo --no-git --redact
          else
            echo "gitleaks container runtime unavailable"
          fi
      - name: Generate dependency inventory placeholder
        run: |
          mkdir -p artifacts
          python -m pip install --disable-pip-version-check -q pip-audit
          pip-audit --format cyclonedx-json --output artifacts/python-sbom.cdx.json . || true
          echo "SBOM generation is conditional; review artifacts/python-sbom.cdx.json."

  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -recursive
      - name: Terraform initialize without backend
        run: terraform -chdir=infra init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra validate

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm audit --omit=dev
        continue-on-error: true

  deployment-portability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preflight deployment tools
        run: python scripts/preflight.py
      - name: Lint Helm chart when Helm is available
        run: |
          if command -v helm >/dev/null 2>&1; then
            helm lint charts/agentblackbox
            for profile in small standard ha; do
              helm template agentblackbox charts/agentblackbox \
                -f "charts/agentblackbox/values-${profile}.yaml" >/dev/null
            done
          else
            echo "SKIP: Helm is not installed; chart validation was not attempted."
          fi
      - name: Check kind/kubectl availability honestly
        run: |
          if command -v kind >/dev/null 2>&1 && command -v kubectl >/dev/null 2>&1; then
            echo "PASS: kind and kubectl are available; no cluster was created or modified."
          else
            echo "SKIP: kind and/or kubectl are absent; cluster validation was not attempted."
          fi
