nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  enabled: true
  replicaCount: 1
  image:
    repository: agentblackbox-api
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 8000
  env:
    ENV: development
    AGENTBLACKBOX_DATABASE_URL: sqlite:////data/agentblackbox.db
  secretRef: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}
  podAnnotations: {}
  probes:
    enabled: true

web:
  enabled: true
  replicaCount: 1
  image:
    repository: agentblackbox-web
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
    NEXT_PUBLIC_API_BASE_URL: http://agentblackbox-api:8000
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 512Mi}
  podAnnotations: {}
  probes:
    enabled: true

worker:
  enabled: false
  replicaCount: 1
  image:
    repository: agentblackbox-api
    tag: local
    pullPolicy: IfNotPresent
  command: ["python", "-m", "agentblackbox"]
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
  podAnnotations: {}

migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  image:
    repository: agentblackbox-api
    tag: local
    pullPolicy: IfNotPresent
  command: ["alembic", "upgrade", "head"]
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceLabels: {}
  allowedEgressCidrs: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
