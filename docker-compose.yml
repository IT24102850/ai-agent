services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AGENTBLACKBOX_API_KEY: local-dev-key
      AGENTBLACKBOX_DATABASE_URL: sqlite:////data/agentblackbox.db
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentblackbox
      POSTGRES_USER: agentblackbox
      POSTGRES_PASSWORD: local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentblackbox -d agentblackbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  postgres-data:
  minio-data:
