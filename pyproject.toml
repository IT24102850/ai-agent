[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentblackbox"
version = "0.1.0"
description = "Deterministic integrity primitives for auditable AI agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
signing = ["cryptography>=42"]
argon2 = ["argon2-cffi>=23"]
pdf = ["weasyprint>=60"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "fastapi>=0.115",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src", "sdk-python"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
